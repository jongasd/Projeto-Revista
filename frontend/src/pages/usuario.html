<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conecta Jovem — Cadastro</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>

  <body>
    <header class="header"><h1>Conecta Jovem</h1></header>

    <main class="container">
      <!-- ── ESQUERDO ── -->
      <section class="left">
        <article class="logo-area">
          <img
            src="../images/conecta-jovem.png"
            alt="Conecta Jovem"
            class="logo-img"
          />
        </article>
      </section>

      <!-- ── DIREITO ── -->
      <section class="right">
        <article class="form-box">
          <h2 class="title">CADASTRO</h2>

          <form id="cadastroForm">
            <div class="input-group">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" placeholder="Nome completo" />
            </div>

            <div class="input-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" placeholder="Senha" />
            </div>

            <div class="input-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="E-mail" />
            </div>

            <div class="input-group">
              <label for="cargo">Cargo</label>
              <select id="cargo">
                <option value="Aluno">Aluno</option>
                <option value="Professor">Professor</option>
              </select>
            </div>

            <div class="input-group" id="grupo-rm">
              <label for="rm">RM</label>
              <input type="text" id="rm" placeholder="RM" />
            </div>

            <div class="input-group hidden" id="grupo-nif">
              <label for="nif">NIF</label>
              <input type="text" id="nif" placeholder="NIF" />
            </div>

            <button type="submit" class="btn">
              Cadastrar e ir para tela inicial
            </button>
          </form>

          <p class="cancel">Cancelar cadastro</p>
        </article>
      </section>
    </main>

    <footer class="footer"><p>© 2026 Conecta Jovem</p></footer>

    <script src="../scripts/index.js"></script>
  </body>
</html>
